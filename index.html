<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Super Cat Typing Adventure - Guaranteed Mobile Fit!</title>
    <style>
        :root {
            --bg-start: #ff9a9e;
            --bg-end: #fecfef;
            --box-bg: #ffffff;
            --ui-bg: #ffeaa7;
            --word-bg: #fff2cc;
            --word-border: #ffb142;
            --text-color: #2c3e50;
            --key-bg: #d1d8e0;
            --key-text: #2c3e50;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, var(--bg-start), var(--bg-end));
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh; /* Fallback */
            height: 100dvh; /* Dynamic viewport height for modern mobiles */
            width: 100vw;
            align-items: center;
        }

        /* 60% SCREEN FOR THE GAME GRAPHICS */
        #game-container {
            position: relative;
            width: 95%;
            max-width: 500px;
            height: 60%; 
            margin-top: 5px;
            background: var(--box-bg);
            border: 3px solid #4a4a4a;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        #ui-bar {
            display: flex;
            justify-content: space-around;
            background: var(--ui-bg);
            padding: 6px;
            font-size: 15px;
            font-weight: bold;
            border-bottom: 3px solid #4a4a4a;
        }

        #word-area {
            position: relative;
            height: calc(100% - 35px);
            width: 100%;
        }

        .word {
            position: absolute;
            font-size: 20px;
            font-weight: bold;
            color: var(--text-color);
            background: var(--word-bg);
            padding: 4px 10px;
            border-radius: 12px;
            border: 2px solid var(--word-border);
            white-space: nowrap;
        }

        .power-freeze { background: #74b9ff !important; border-color: #0984e3 !important; color: white !important; }
        .power-boom { background: #ff7675 !important; border-color: #d63031 !important; color: white !important; }
        .power-heal { background: #55efc4 !important; border-color: #00b894 !important; color: white !important; }
        .typed-letter { color: #2ed573; }

        #input-display {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            background: #f1f2f6;
            padding: 3px 12px;
            border-radius: 8px;
            border: 2px dashed #a4b0be;
            color: #2c3e50;
            z-index: 5;
        }

        /* 40% SCREEN FOR THE KEYBOARD (NEVER OVERFLOWS) */
        #keyboard-container {
            width: 100%;
            max-width: 500px;
            height: 38%; 
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.15);
            border-top: 3px solid rgba(0,0,0,0.2);
            padding-bottom: calc(max(12px, env(safe-area-inset-bottom)) + 5px); /* Big safety push for navigation bar */
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            flex: 1; /* Divides the 38% height equally */
        }

        .key {
            background: var(--key-bg);
            color: var(--key-text);
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        .key:active {
            transform: translateY(1px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.2);
            background: #b2bec3;
        }

        .key-backspace { flex: 1.4; background: #fab1a0; color: white; }
        .key-enter { flex: 1.4; background: #55efc4; color: white; }

        #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            display: none;
            z-index: 20;
        }

        button.play-again {
            padding: 8px 16px;
            font-size: 16px;
            font-family: inherit;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 3px #27ae60;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-bar">
        <div>Pts: <span id="score">0</span></div>
        <div>Lvl: <span id="level">1</span></div>
        <div>❤️: <span id="hearts">❤️❤️❤️</span></div>
    </div>
    
    <div id="word-area"></div>
    <div id="input-display">Tap ABC!</div>

    <div id="game-over-screen">
        <h2>Game Over! 🙀</h2>
        <p>Score: <span id="final-score">0</span></p>
        <button class="play-again" onclick="startGame()">Play Again</button>
    </div>
</div>

<div id="keyboard-container">
    <div class="keyboard-row">
        <button class="key" onclick="handleKeyInput('q')">Q</button>
        <button class="key" onclick="handleKeyInput('w')">W</button>
        <button class="key" onclick="handleKeyInput('e')">E</button>
        <button class="key" onclick="handleKeyInput('r')">R</button>
        <button class="key" onclick="handleKeyInput('t')">T</button>
        <button class="key" onclick="handleKeyInput('y')">Y</button>
        <button class="key" onclick="handleKeyInput('u')">U</button>
        <button class="key" onclick="handleKeyInput('i')">I</button>
        <button class="key" onclick="handleKeyInput('o')">O</button>
        <button class="key" onclick="handleKeyInput('p')">P</button>
    </div>
    <div class="keyboard-row">
        <button class="key" onclick="handleKeyInput('a')">A</button>
        <button class="key" onclick="handleKeyInput('s')">S</button>
        <button class="key" onclick="handleKeyInput('d')">D</button>
        <button class="key" onclick="handleKeyInput('f')">F</button>
        <button class="key" onclick="handleKeyInput('g')">G</button>
        <button class="key" onclick="handleKeyInput('h')">H</button>
        <button class="key" onclick="handleKeyInput('j')">J</button>
        <button class="key" onclick="handleKeyInput('k')">K</button>
        <button class="key" onclick="handleKeyInput('l')">L</button>
    </div>
    <div class="keyboard-row">
        <button class="key key-backspace" onclick="handleKeyInput('Backspace')">⌫</button>
        <button class="key" onclick="handleKeyInput('z')">Z</button>
        <button class="key" onclick="handleKeyInput('x')">X</button>
        <button class="key" onclick="handleKeyInput('c')">C</button>
        <button class="key" onclick="handleKeyInput('v')">V</button>
        <button class="key" onclick="handleKeyInput('b')">B</button>
        <button class="key" onclick="handleKeyInput('n')">N</button>
        <button class="key" onclick="handleKeyInput('m')">M</button>
        <button class="key key-enter" onclick="handleKeyInput('Enter')">⏎</button>
    </div>
</div>

<script>
    const wordList = ["cat", "dog", "sun", "map", "run", "hop", "red", "blue", "tree", "fish", "frog", "jump", "cake", "star", "ball", "book", "milk", "lion", "duck", "kite", "pink", "baby", "toy", "happy"];
    const powerUps = ["freeze", "boom", "heal"];
    
    let score = 0, level = 1, lives = 3, speed = 1.2, activeWords = [], currentInput = "", gameInterval, spawnInterval, isFrozen = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration) {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    const themes = {
        1: { start: '#ff9a9e', end: '#fecfef', ui: '#ffeaa7', word: '#fff2cc', border: '#ffb142' },
        2: { start: '#11998e', end: '#38ef7d', ui: '#c8d6e5', word: '#e3f2fd', border: '#2196f3' },
        3: { start: '#6c5ce7', end: '#a29bfe', ui: '#dfe6e9', word: '#ffeaa7', border: '#fdcb6e' },
        4: { start: '#141e30', end: '#243b55', ui: '#57606f', word: '#f1f2f6', border: '#747d8c' }
    };

    function changeTheme(lvl) {
        const t = themes[lvl] || themes[4]; 
        document.documentElement.style.setProperty('--bg-start', t.start);
        document.documentElement.style.setProperty('--bg-end', t.end);
        document.documentElement.style.setProperty('--ui-bg', t.ui);
        document.documentElement.style.setProperty('--word-bg', t.word);
        document.documentElement.style.setProperty('--word-border', t.border);
    }

    function startGame() {
        score = 0; level = 1; lives = 3; speed = 1.2; isFrozen = false;
        activeWords.forEach(w => w.element.remove()); activeWords = [];
        currentInput = ""; document.getElementById('input-display').innerText = "Tap ABC!";
        document.getElementById('game-over-screen').style.display = 'none';
        changeTheme(1); updateUI();
        clearInterval(gameInterval); clearInterval(spawnInterval);
        gameInterval = setInterval(updateGame, 1000 / 60);
        spawnInterval = setInterval(spawnWord, 2600);
        spawnWord();
    }

    function spawnWord() {
        if (lives <= 0) return;
        let isPower = Math.random() < 0.18;
        let text = isPower ? powerUps[Math.floor(Math.random() * powerUps.length)] : wordList[Math.floor(Math.random() * wordList.length)];
        let typeClass = isPower ? " power-" + text : "";

        const element = document.createElement('div');
        element.className = 'word' + typeClass;
        element.innerHTML = text; 
        
        const containerWidth = document.getElementById('word-area').offsetWidth;
        element.style.left = Math.random() * (containerWidth - 90) + 5 + 'px'; 
        element.style.top = '0px';
        document.getElementById('word-area').appendChild(element);

        activeWords.push({ text: text, y: 0, element: element, isPower: isPower });
    }

    function updateGame() {
        let currentSpeed = isFrozen ? 0 : speed;
        const gameHeight = document.getElementById('word-area').offsetHeight;
        const bottomBoundary = gameHeight - 35;

        for (let i = activeWords.length - 1; i >= 0; i--) {
            let word = activeWords[i];
            word.y += currentSpeed;
            word.element.style.top = word.y + 'px';

            if (word.y > bottomBoundary) {
                word.element.remove();
                activeWords.splice(i, 1);
                if (!word.isPower) {
                    lives--;
                    playTone(150, 'sawtooth', 0.3); updateUI();
                    if (lives <= 0) endGame();
                }
            }
        }
    }

    function handleKeyInput(key) {
        if (lives <= 0) return;
        playTone(600, 'sine', 0.03); 

        if (key === 'Backspace' || key === 'Delete') {
            currentInput = currentInput.slice(0, -1);
        } else if (key === 'Enter' || key === ' ') {
            currentInput = ""; 
        } else if (key.length === 1 && key.match(/[a-z]/i)) {
            currentInput += key.toLowerCase();
        }
        
        document.getElementById('input-display').innerText = currentInput || "Tap ABC!";
        highlightWords();
        checkWordMatch();
    }

    window.addEventListener('keydown', (e) => handleKeyInput(e.key));

    function highlightWords() {
        activeWords.forEach(word => {
            if (word.text.startsWith(currentInput) && currentInput !== "") {
                let highlighted = `<span class="typed-letter">${word.text.substring(0, currentInput.length)}</span>${word.text.substring(currentInput.length)}`;
                word.element.innerHTML = highlighted;
            } else { word.element.innerHTML = word.text; }
        });
    }

    function checkWordMatch() {
        const index = activeWords.findIndex(w => w.text === currentInput);
        if (index !== -1) {
            let matchedWord = activeWords[index];
            matchedWord.element.remove();
            activeWords.splice(index, 1);
            score += 10; currentInput = "";
            document.getElementById('input-display').innerText = "Nice!";
            
            if (matchedWord.isPower) { applyPowerUp(matchedWord.text); } 
            else { playTone(880, 'sine', 0.08); }

            let newLevel = Math.floor(score / 70) + 1;
            if (newLevel > level) {
                level = newLevel; speed += 0.3; changeTheme(level);
                playTone(1100, 'triangle', 0.4); 
            }
            updateUI();
        }
    }

    function applyPowerUp(type) {
        if (type === 'freeze') {
            isFrozen = true; playTone(400, 'triangle', 0.5);
            setTimeout(() => isFrozen = false, 4000);
        } else if (type === 'boom') {
            playTone(200, 'square', 0.4);
            activeWords.forEach(w => w.element.remove()); activeWords = [];
        } else if (type === 'heal') {
            playTone(950, 'sine', 0.3); if (lives < 3) lives++;
        }
    }

    function updateUI() {
        document.getElementById('score').innerText = score;
        document.getElementById('level').innerText = level;
        document.getElementById('hearts').innerText = "❤️".repeat(Math.max(0, lives)) || "💔";
    }

    function endGame() {
        clearInterval(gameInterval); clearInterval(spawnInterval);
        playTone(120, 'sawtooth', 0.6);
        document.getElementById('final-score').innerText = score;
        document.getElementById('game-over-screen').style.display = 'flex';
    }

    startGame();
</script>
</body>
</html>
